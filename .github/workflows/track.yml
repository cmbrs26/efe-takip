name: efe-takip
on:
  schedule:
    - cron: "*/10 * * * *"   # her 10 dakikada bir
  workflow_dispatch:          # elle de çalıştırılabilir
permissions:
  contents: read
concurrency:
  group: efe-takip
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright
      - name: Önceki durumu getir
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: durum-yok
          restore-keys: durum-
      - name: Tarayıcı önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v1
      - run: python tracker.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SESSION_COOKIES: ${{ secrets.SESSION_COOKIES }}
          SESSION_LOCALSTORAGE: ${{ secrets.SESSION_LOCALSTORAGE }}
      - name: Durumu kaydet
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: durum-${{ hashFiles('state.json') }}
